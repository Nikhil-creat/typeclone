services:
  - type: web
    name: typeclone-lite
    runtime: python
    plan: free
    rootDir: backend-lite
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
